[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Reenvía las llamadas /api/* del frontend hacia el backend en Render. El frontend sigue
# usando rutas relativas ("/api/jira/...") sin ningún cambio de código, y al ser un proxy
# del lado de Netlify (no una llamada cross-origin del navegador), no hay problema de CORS.
[[redirects]]
  from = "/api/*"
  to = "https://triage-soporte.onrender.com/api/:splat"
  status = 200
  force = true

# Red de seguridad para rutas internas tipo SPA (hoy la app no usa react-router ni URLs
# por vista, así que esto no debería activarse todavía — se deja preparado por si se
# agrega ruteo más adelante).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
